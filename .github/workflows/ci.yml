name: CI

on:
  push:
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest # WPF needs Windows
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      # Locked restore; NuGetAudit warnings fail it through TreatWarningsAsErrors (Directory.Build.props).
      - run: dotnet restore LarpStrap.slnx --locked-mode
      - run: dotnet format LarpStrap.slnx --verify-no-changes --no-restore
      - run: dotnet build LarpStrap.slnx -c Release --no-restore
      - run: dotnet test --solution LarpStrap.slnx -c Release --no-build
      # `dotnet list package --vulnerable` exits 0 even when it finds a vulnerability (checked 2026-10-14), so parse its JSON.
      - name: Fail on vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list LarpStrap.slnx package --vulnerable --include-transitive --format json | ConvertFrom-Json
          $found = @($report.projects | ForEach-Object { $_.frameworks } | ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } | Where-Object { $_.vulnerabilities })
          if ($found.Count -gt 0) { $found | ForEach-Object { "::error::Paquete vulnerable: $($_.id) $($_.resolvedVersion)" }; exit 1 }
          "Sin paquetes vulnerables conocidos."
